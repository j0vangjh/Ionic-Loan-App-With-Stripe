<ion-header>
  <ion-toolbar>
    <ion-title>Transaction History</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card *ngFor="let transaction of transactions" >
    <ion-card-header>
      <ion-card-title>Loan ID: {{ transaction.loanId }}</ion-card-title>
      <ion-card-subtitle>Payment ID: {{ transaction.paymentId }}</ion-card-subtitle>
    </ion-card-header>
  
    <ion-card-content>
      Amount: ${{ transaction.amount }} <br/>
      Date: {{ transaction.timestamp | date: 'medium' }}
    </ion-card-content>
  </ion-card>
  <ion-item *ngIf="transactions.length === 0">
    <ion-label>
      No transactions found
    </ion-label>
  </ion-item>
</ion-content>
